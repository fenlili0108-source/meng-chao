<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解梦 · 粒子星空</title>
<style>
  :root {
    --bg-base:        #0a0a14;
    --text-primary:   #ECECF1;
    --text-secondary: #9A9AB0;
    --accent:         #8B7CF6;
    --accent-blue:    #5B8DEF;
    --glow-core:      #a78bfa;
    --font-display: 'Georgia', 'Songti SC', serif;
    --font-body: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh; overflow-x:hidden;
    /* 顶部一层极淡的紫色氛围,让纯黑不那么死 */
    background-image:
      radial-gradient(ellipse 70% 50% at 50% 35%, rgba(139,124,246,0.10), transparent 60%);
  }

  /* hero 容器 */
  .hero { position:relative; min-height:100vh; overflow:hidden; }

  /* 粒子画布:铺满 hero,放在内容下层 */
  #particles {
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0; display:block;
  }

  /* hero 内容浮在粒子之上 */
  .hero-content {
    position:relative; z-index:1;
    text-align:center; padding-top:140px;
  }
  .pill {
    display:inline-flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
    border-radius:999px; padding:7px 16px; font-size:13px; color:var(--text-secondary);
    margin-bottom:36px; backdrop-filter:blur(10px);
  }
  .pill .dot { width:6px;height:6px;border-radius:50%;background:var(--glow-core);box-shadow:0 0 8px var(--glow-core); }
  h1 {
    font-family:var(--font-display);
    font-size:clamp(42px,6vw,76px); font-weight:600; letter-spacing:-0.02em; line-height:1.1;
    background:linear-gradient(180deg,#ffffff 0%,#b8b8d0 60%,#6a6a85 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:20px;
  }
  h1 .accent {
    background:linear-gradient(180deg,#c4b5fd,#8B7CF6);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub { font-size:18px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="hero">
    <canvas id="particles"></canvas>
    <div class="hero-content">
      <div class="pill"><span class="dot"></span> 越用越懂你</div>
      <h1>认识你<span class="accent">梦里</span>的自己</h1>
      <p class="sub">倒出一段梦,再倒出一段。它会记得你说过的每一个。</p>
    </div>
  </div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
const COLORS = ['#8B7CF6', '#5B8DEF', '#a78bfa', '#c4b5fd'];

// 鼠标位置(设备像素坐标);初始放在屏幕外,避免一开始就有一团反应
const mouse = { x: -9999, y: -9999, active: false };
const MOUSE_RADIUS = 130; // 影响半径(CSS 像素)

function resize() {
  W = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  H = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
}
window.addEventListener('resize', resize);

// 监听鼠标:换算成画布的设备像素坐标
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * window.devicePixelRatio;
  mouse.y = (e.clientY - rect.top) * window.devicePixelRatio;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
// 让覆盖在上面的内容也能透传鼠标移动(否则移到文字上就丢失跟随)
document.querySelector('.hero').addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * window.devicePixelRatio;
  mouse.y = (e.clientY - rect.top) * window.devicePixelRatio;
  mouse.active = true;
});

function init() {
  resize();
  particles = [];
  const count = Math.min(140, Math.floor((W * H) / (22000 * window.devicePixelRatio)));
  for (let i = 0; i < count; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    particles.push({
      x, y,
      homeX: x, homeY: y,           // 原位,被推开后会缓缓飘回
      r: (Math.random() * 1.6 + 0.4) * window.devicePixelRatio,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      vx: (Math.random() - 0.5) * 0.12 * window.devicePixelRatio,
      vy: (Math.random() - 0.5) * 0.12 * window.devicePixelRatio,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.012 + 0.004,
      baseAlpha: Math.random() * 0.5 + 0.2
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.5;
  const mr = MOUSE_RADIUS * window.devicePixelRatio;

  for (const p of particles) {
    // 基础漂移
    p.x += p.vx; p.y += p.vy;
    // 缓慢飘回原位(让被推开的粒子最终回归,不会越漂越乱)
    p.homeX += p.vx; p.homeY += p.vy;
    if (p.homeX < 0) p.homeX = W; if (p.homeX > W) p.homeX = 0;
    if (p.homeY < 0) p.homeY = H; if (p.homeY > H) p.homeY = 0;

    // —— 光标跟随:近鼠标的粒子被轻轻推开 ——
    let mouseGlow = 0;
    if (mouse.active) {
      const dxm = p.x - mouse.x, dym = p.y - mouse.y;
      const dm = Math.sqrt(dxm*dxm + dym*dym);
      if (dm < mr && dm > 0.001) {
        const force = (1 - dm / mr);          // 越近力越大
        p.x += (dxm / dm) * force * 2.2 * window.devicePixelRatio;  // 推开
        p.y += (dym / dm) * force * 2.2 * window.devicePixelRatio;
        mouseGlow = force;                     // 越近越亮
      }
    }
    // 被推开后,缓缓拉回各自的 home(弹性)
    p.x += (p.homeX - p.x) * 0.02;
    p.y += (p.homeY - p.y) * 0.02;

    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

    // 呼吸
    p.phase += p.speed;
    const alpha = p.baseAlpha * (0.5 + 0.5 * Math.sin(p.phase));

    const dx = p.x - cx, dy = p.y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const centerBoost = Math.max(0, 1 - dist / (W * 0.55));

    // 最终亮度 = 呼吸 + 中心增亮 + 鼠标增亮
    const finalAlpha = Math.min(1, alpha + centerBoost * 0.25 + mouseGlow * 0.5);
    const glowR = p.r * (4 + mouseGlow * 3);   // 近鼠标的粒子光晕也更大
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
    g.addColorStop(0, hexA(p.color, finalAlpha));
    g.addColorStop(1, hexA(p.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hexA(p.color, Math.min(1, finalAlpha + 0.3));
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 粒子间的临近连线
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const maxD = 110 * window.devicePixelRatio;
      if (d < maxD) {
        const lineAlpha = (1 - d / maxD) * 0.12;
        ctx.strokeStyle = hexA('#8B7CF6', lineAlpha);
        ctx.lineWidth = 0.5 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }

  // —— 鼠标与附近粒子拉出更亮的连线,形成"光标牵引"的网 ——
  if (mouse.active) {
    for (const p of particles) {
      const dxm = p.x - mouse.x, dym = p.y - mouse.y;
      const dm = Math.sqrt(dxm*dxm + dym*dym);
      if (dm < mr) {
        const lineAlpha = (1 - dm / mr) * 0.5;
        ctx.strokeStyle = hexA('#a78bfa', lineAlpha);
        ctx.lineWidth = 0.7 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a})`;
}

init();
draw();
</script>
</body>
</html>
